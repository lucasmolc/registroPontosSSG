# =============================================================
# ARQUIVO DE EXEMPLO DE CONFIGURAÇÃO
# Copie este arquivo para config.yaml e preencha suas credenciais
# =============================================================

# Configurações do Sistema SSG
ssg:
  url: "https://ssg.sysmap.com.br"
  timesheet_url: "https://ssg.sysmap.com.br/new/timesheet/timesheetrecording.asp"
  
# Configurações de Login
# IMPORTANTE: Preencha com suas credenciais do SSG
credentials:
  username: "seu.usuario"
  password: "sua_senha"
  # Secret key do TOTP para 2FA automático (opcional)
  # Obtenha reconfigurando o 2FA e copiando a secret key
  # totp_secret: "SUASECRETKEYAQUI"

# Configurações de Arquivo de Pontos
arquivo_pontos:
  # Diretório onde o arquivo de pontos deve estar
  diretorio: "data/pontos"
  # Nome do arquivo de pontos
  nome_arquivo: "pontos.xlsx"
  # Formato do arquivo (xlsx ou csv)
  formato: "xlsx"

# Regras de Validação de Horários
# Estas regras fazem AJUSTES AUTOMÁTICOS nos horários para evitar erros do SSG
# IMPORTANTE: O total de horas trabalhadas é SEMPRE mantido igual ao original
# Quando um horário é ajustado, a saída é compensada automaticamente
validacao:
  # Ajusta horários redondos automaticamente (ex: 08:00 -> 08:01)
  # Compensa na saída para manter o total de horas
  bloquear_horarios_redondos: true
  
  # Quantidade de dias para verificar horários duplicados
  dias_verificar_duplicados: 5
  
  # Ajusta horários duplicados automaticamente (+1min)
  # Se 12:12 já foi usado nos últimos 5 dias, vira 12:13
  # Compensa na saída para manter o total de horas
  bloquear_horarios_duplicados: true
  
  # Ajusta almoço de exatamente 1 hora automaticamente (+1min)
  # Almoço de 60min exatos vira 61min
  # Compensa na saída para manter o total de horas
  bloquear_almoco_1_hora_exata: true

# Configurações de Automação
automacao:
  # Timeout para operações em milissegundos
  timeout: 30000
  # Executar navegador em modo invisível
  headless: false
  # Delay entre ações (em ms) - útil para debug
  slow_mo: 100
  # Sempre selecionar mês atual ao entrar na página
  selecionar_mes_atual: true
  # Ignorar datas já cadastradas no SSG
  ignorar_datas_existentes: true
  # Usar o Chrome instalado no sistema (recomendado para passar no Cloudflare)
  usar_chrome_sistema: true
  # Caminho do Chrome (deixe vazio para detecção automática)
  chrome_path: ""
  # Usar perfil padrão do Chrome do usuário (com sessões e cookies existentes)
  # ATENÇÃO: Se true, feche o Chrome antes de executar o script
  usar_perfil_chrome: false

# Configurações de Log
log:
  # Nível de log: DEBUG, INFO, WARNING, ERROR, CRITICAL
  nivel: "INFO"
  # Arquivo de log
  arquivo: "logs/registro_pontos.log"
